services:
  # main apache service running the full website
  apache:
    build: .
    ports:
      - ${PORT:-80}:80
    restart: unless-stopped
    develop:
      watch:
        - path: app/
          action: rebuild
        - path: www/
          action: rebuild
        - path: composer.lock
          action: rebuild
        - path: Dockerfile
          action: rebuild

  # optional playwright test runner, start with `docker compose run --build --rm playwright`
  playwright:
    build: tests/playwright
    environment:
      - INTEGRATION_URL=http://apache
    profiles:
      - playwright

  # tailwind dev sidecar to watch and recompile CSS on demand
  tailwind:
    build:
      context: .
      target: tailwind
    command: --watch -o www/src/tailwind.min.css --minify
    restart: unless-stopped
    stdin_open: true
    stop_signal: SIGKILL
    volumes:
      - ./tailwind.css:/app/tailwind.css:ro
      - ./www:/app/www:rw
    develop:
      watch:
        - path: Dockerfile
          action: rebuild
